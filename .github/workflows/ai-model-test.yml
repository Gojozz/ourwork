name: AI Model Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          echo "===== RUNNER ====="
          nproc
          free -h
          df -h /
          uname -a
          node --version

      - name: Download llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build /tmp/llama.cpp/build \
            --config Release \
            -j2 \
            --target llama-server

          /tmp/llama.cpp/build/bin/llama-server --version

      - name: Start llama server
        run: |
          /tmp/llama.cpp/build/bin/llama-server \
            -hf Qwen/Qwen3-4B-GGUF:Q4_K_M \
            -c 8192 \
            -t 4 \
            -tb 4 \
            --host 127.0.0.1 \
            --port 8080 \
            > /tmp/llama-server.log 2>&1 &

          echo $! > /tmp/llama.pid

          echo "Waiting for llama-server..."

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/v1/models > /tmp/models.json; then
              echo "SERVER READY"
              cat /tmp/models.json
              break
            fi

            sleep 2
          done

          if ! curl -sf http://127.0.0.1:8080/v1/models > /tmp/models.json; then
            echo "===== SERVER LOG ====="
            cat /tmp/llama-server.log
            exit 1
          fi

      - name: Run benchmark
        run: |
          echo "===== STRATEGIST BENCHMARK ====="

          cat > /tmp/strategist-test.js <<'JS'
          const Strategist = require(process.cwd() + "/engine/strategist");
          const TopicGenerator = require(process.cwd() + "/engine/topic-generator");
          const TopicValidator = require(process.cwd() + "/engine/topic-validator");
          const TopicEngine = require(process.cwd() + "/engine/topic-engine");

          async function main() {
            const strategist = new Strategist({
              defaultIdeas: 5
            });

            const prompt = strategist.buildPrompt({
              ideas: 5,
              usedTopics: [
                {
                  id: "earth-stops-rotating",
                  title: "What If Earth Suddenly Stopped Rotating?"
                },
                {
                  id: "moon-disappears",
                  title: "What If the Moon Suddenly Disappeared?"
                },
                {
                  id: "gravity-doubles",
                  title: "What If Earth's Gravity Suddenly Doubled?"
                }
              ]
            });

            console.log("===== PROMPT =====");
            console.log(prompt);

            const response = await fetch(
              "http://127.0.0.1:8080/v1/chat/completions",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  model: "Qwen/Qwen3-4B-GGUF:Q4_K_M",
                  messages: [
                    {
                      role: "user",
                      content: prompt
                    }
                  ],
                  chat_template_kwargs: {
                    enable_thinking: false
                  },
                  temperature: 0.2,
                  max_tokens: 1200,
                  response_format: {
                    type: "json_object"
                  }
                })
              }
            );

            if (!response.ok) {
              throw new Error(
                `HTTP ${response.status}: ${await response.text()}`
              );
            }

            const data = await response.json();

            const content =
              data &&
              data.choices &&
              data.choices[0] &&
              data.choices[0].message &&
              data.choices[0].message.content;

            if (typeof content !== "string") {
              throw new Error("Missing model content");
            }

            console.log("===== RAW MODEL OUTPUT =====");
            console.log(content);

            const generator = new TopicGenerator({
              minIdeas: 1,
              maxIdeas: 10
            });

            const topics = generator.generate(content);

            console.log("===== GENERATED TOPICS =====");
            console.log(JSON.stringify(topics, null, 2));

            const validator = new TopicValidator();
            const validation = validator.validateMany(topics);

            console.log("===== VALIDATION =====");
            console.log(JSON.stringify(validation, null, 2));

            if (!validation.valid) {
              throw new Error(
                "TOPIC VALIDATION FAILED: " +
                validation.errors
                  .map(e => `${e.id}: ${e.error}`)
                  .join("; ")
              );
            }

            const engine = new TopicEngine();

            engine.addMany(topics);

            const ranking = engine.rank();

            console.log("===== RANKING =====");
            console.log(JSON.stringify(ranking, null, 2));

            const selected = engine.next();

            if (!selected) {
              throw new Error("No topic selected");
            }

            console.log("===== SELECTED =====");
            console.log(JSON.stringify(selected, null, 2));

            console.log("===== PIPELINE TEST =====");
            console.log("STRATEGIST: OK");
            console.log("GENERATOR: OK");
            console.log("VALIDATOR: OK");
            console.log("TOPIC ENGINE: OK");
            console.log("SELECTED: OK");

            console.log("===== MODEL METRICS =====");
            console.log(JSON.stringify(data.timings || {}, null, 2));
            console.log(JSON.stringify(data.usage || {}, null, 2));
            console.log("FINISH_REASON:", data.choices[0].finish_reason);
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

          START=$(date +%s)

          node /tmp/strategist-test.js | tee /tmp/strategist-output.txt

          END=$(date +%s)
          ELAPSED=$((END - START))

          echo
          echo "===== TIME ====="
          echo "${ELAPSED} seconds"

          echo
          echo "===== BENCHMARK RESULT ====="

          grep -q "STRATEGIST: OK" /tmp/strategist-output.txt
          grep -q "GENERATOR: OK" /tmp/strategist-output.txt
          grep -q "VALIDATOR: OK" /tmp/strategist-output.txt
          grep -q "TOPIC ENGINE: OK" /tmp/strategist-output.txt
          grep -q "SELECTED: OK" /tmp/strategist-output.txt

          echo "STRATEGIST PIPELINE: OK"
          echo "TIME: ${ELAPSED} seconds"

      - name: Server diagnostics
        if: always()
        run: |
          echo "===== LLAMA SERVER LOG ====="
          cat /tmp/llama-server.log 2>/dev/null || true

          echo
          echo "===== MEMORY AFTER TEST ====="
          free -h
