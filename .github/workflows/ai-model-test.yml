name: AI Model Benchmark

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          echo "===== RUNNER ====="
          nproc
          free -h
          df -h /
          uname -a
          node --version

      - name: Download llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp

          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build /tmp/llama.cpp/build \
            --config Release \
            -j2 \
            --target llama-server

          /tmp/llama.cpp/build/bin/llama-server --version

      - name: Start llama server
        run: |
          /tmp/llama.cpp/build/bin/llama-server \
            -hf Qwen/Qwen3-4B-GGUF:Q4_K_M \
            -c 8192 \
            -t 4 \
            -tb 4 \
            --host 127.0.0.1 \
            --port 8080 \
            > /tmp/llama-server.log 2>&1 &

          echo $! > /tmp/llama.pid

          echo "Waiting for llama-server..."

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/v1/models > /tmp/models.json; then
              echo "SERVER READY"
              cat /tmp/models.json
              break
            fi

            sleep 2
          done

          if ! curl -sf http://127.0.0.1:8080/v1/models > /tmp/models.json; then
            echo "===== SERVER LOG ====="
            cat /tmp/llama-server.log
            exit 1
          fi

      - name: Run benchmark
        run: |
          echo "===== MODEL TEST ====="

          START=$(date +%s)

          RESPONSE=$(curl -sf \
            --max-time 300 \
            http://127.0.0.1:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "Qwen/Qwen3-4B-GGUF:Q4_K_M",
              "messages": [
                {
                  "role": "system",
                  "content": "You are the AI Strategist of WHAT IF LAB. Return only valid JSON. Do not explain. Do not use markdown."
                },
                {
                  "role": "user",
                  "content": "Generate exactly 3 scientific What If ideas for YouTube Shorts. Each topic must contain id, title, curiosity, visual, shortForm, novelty, educational. curiosity, visual, and shortForm must be concise strings. novelty and educational must be numbers from 0 to 10. Return only a JSON object with a topics array containing exactly 3 objects."
                }
              ],
              "chat_template_kwargs": {
                "enable_thinking": false
              },
              "temperature": 0.2,
              "max_tokens": 1200,
              "response_format": {
                "type": "json_object"
              }
            }')

          END=$(date +%s)
          ELAPSED=$((END - START))

          echo "===== RESPONSE ====="
          echo "$RESPONSE"

          echo
          echo "===== TIME ====="
          echo "${ELAPSED} seconds"

          echo
          echo "===== PARSE TEST ====="
          printf '%s' "$RESPONSE" | jq -e '.choices[0].message.content | fromjson | .topics | length == 3' >/dev/null
          echo "JSON: OK"

          printf '%s' "$RESPONSE" | jq -r '.choices[0].finish_reason'
          printf '%s' "$RESPONSE" | jq '.usage // {}'

      - name: Server diagnostics
        if: always()
        run: |
          echo "===== LLAMA SERVER LOG ====="
          cat /tmp/llama-server.log 2>/dev/null || true

          echo
          echo "===== MEMORY AFTER TEST ====="
          free -h
